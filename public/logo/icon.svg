<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#iconGradient)" />
  
  <!-- Event card design -->
  <rect x="16" y="18" width="32" height="8" rx="2" fill="white" opacity="0.9" />
  <rect x="16" y="26" width="32" height="20" rx="2" fill="white" opacity="0.95" />
  
  <!-- Event details -->
  <line x1="20" y1="32" x2="44" y2="32" stroke="#6366f1" stroke-width="2" stroke-linecap="round" />
  <line x1="20" y1="38" x2="36" y2="38" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="20" y1="42" x2="40" y2="42" stroke="#f472b6" stroke-width="1.5" stroke-linecap="round" />
  
  <!-- Accent dot -->
